spring.application.name=employee_leave_backend
spring.config.import=optional:file:.env[.properties],optional:file:employee_leave_backend/.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
server.port=8081